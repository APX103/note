<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杂项 Other</title>
<style>
    :root {
        --bg: #0f0f12; --surface: #1a1a1f; --surface-hover: #222228;
        --text: #e8e8ec; --text-secondary: #9ca3af;
        --accent: #6366f1; --accent-glow: rgba(99, 102, 241, 0.15); --accent-2: #8b5cf6;
        --border: rgba(255,255,255,0.06);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.7;
        -webkit-font-smoothing: antialiased; min-height: 100vh;
    }
    .bg-glow { position: fixed; width: 500px; height: 500px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
        top: -150px; right: -150px; pointer-events: none; z-index: 0; }
    .bg-glow-2 { position: fixed; width: 400px; height: 400px; border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
        bottom: -100px; left: -100px; pointer-events: none; z-index: 0; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }
    .hero { padding: 80px 0 40px; }
    .hero h1 { font-size: 2.2em; font-weight: 700;
        background: linear-gradient(135deg, var(--text) 0%, var(--accent) 50%, var(--accent-2) 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        margin-bottom: 12px; }
    .hero p { color: var(--text-secondary); font-size: 1.05em; }
    .back { display: inline-block; margin-top: 24px; color: var(--text-secondary);
        text-decoration: none; font-size: 0.9em; transition: color 0.2s; }
    .back:hover { color: var(--accent); }
    .section-title { font-size: 1.1em; font-weight: 600; color: var(--text-secondary);
        margin: 48px 0 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 10px; }
    .section-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .section-title .count { font-size: 0.75em; font-weight: 400; opacity: 0.7; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 16px; padding-bottom: 40px; }
    .card { display: block; background: var(--surface); border: 1px solid var(--border);
        border-radius: 12px; padding: 24px 28px; text-decoration: none; color: inherit;
        transition: all 0.25s ease; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        opacity: 0; transition: opacity 0.25s ease; }
    .card:hover { background: var(--surface-hover); border-color: rgba(99, 102, 241, 0.2);
        transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    .card:hover::before { opacity: 1; }
    .card-title { font-size: 1.1em; font-weight: 600; color: var(--text);
        margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
    .card-title .arrow { color: var(--accent); opacity: 0; transform: translateX(-4px);
        transition: all 0.25s ease; font-size: 0.9em; }
    .card:hover .card-title .arrow { opacity: 1; transform: translateX(0); }
    .card-desc { color: var(--text-secondary); font-size: 0.9em; }
    .tag { display: inline-block; font-size: 0.72em; padding: 2px 8px; border-radius: 6px;
        background: rgba(99, 102, 241, 0.1); color: var(--accent); font-weight: 500; }
    .cat-num { font-size: 0.72em; padding: 2px 8px; border-radius: 6px; font-weight: 500;
        background: rgba(255,255,255,0.06); color: var(--text-secondary); }
    .plain-list { list-style: none; padding-bottom: 40px; }
    .plain-list li { padding: 14px 4px; border-bottom: 1px solid var(--border); }
    .plain-list a { color: var(--text); text-decoration: none; font-weight: 500; }
    .plain-list a:hover { color: var(--accent); }
    .plain-list .note { color: var(--text-secondary); font-size: 0.85em; margin-left: 10px; }
    .footer { padding: 30px 0; border-top: 1px solid var(--border); text-align: center;
        color: var(--text-secondary); font-size: 0.82em; }
    .footer a { color: var(--accent); text-decoration: none; }
    @media (max-width: 600px) {
        .hero { padding: 50px 0 30px; } .hero h1 { font-size: 1.6em; } .card { padding: 18px 22px; }
    }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-glow-2"></div>

<div class="container">
    <div class="hero">
        <h1>杂项 Other</h1>
        <p>飞书文档导出、示意图、Obsidian Copilot 配置等零散资料</p>
        <a class="back" href="../index.html">&larr; 返回总览</a>
    </div>
    <div class="section-title"><span class="dot" style="background:#9ca3af"></span> 杂项列表</div>
    <ul class="plain-list">
        <li><a href="feishu_doc.xml">feishu_doc.xml</a><span class="note">飞书文档导出的 XML 原始数据</span></li>
        <li><a href="deep_agent_diagram.png">deep_agent_diagram.png</a><span class="note">Deep Agent 架构示意图（PNG 大图）</span></li>
        <li><a href="copilot/">copilot/</a><span class="note">Obsidian Copilot 插件配置 — custom prompts 与会话记录</span></li>
    </ul>

    <div class="footer">托管于 <a href="https://github.com/APX103/note">GitHub - APX103/note</a></div>
</div>
</body>
</html>
